name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [ main ] # or master, depending on your default branch
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

# Sets permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          
      # Modified to use --legacy-peer-deps
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Update next.config.js for static export
        run: |
          if [ -f "next.config.js" ]; then
            # For next.config.js
            sed -i "s/module.exports = {/module.exports = {\n  output: 'export',\n  images: { unoptimized: true },\n  basePath: '\/${GITHUB_REPOSITORY#*/}',\n  assetPrefix: '\/${GITHUB_REPOSITORY#*/}',/g" next.config.js
          elif [ -f "next.config.mjs" ]; then
            # For next.config.mjs
            sed -i "s/const nextConfig = {/const nextConfig = {\n  output: 'export',\n  images: { unoptimized: true },\n  basePath: '\/${GITHUB_REPOSITORY#*/}',\n  assetPrefix: '\/${GITHUB_REPOSITORY#*/}',/g" next.config.mjs
          fi
        
      - name: Build project
        run: npm run build
        
      - name: Add .nojekyll file
        run: touch ./out/.nojekyll
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4